name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify Release Tag
        id: verify-tag
        shell: bash
        run: |
          tag_pattern='^v([1-9][0-9]{3})\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(-([1-9][0-9]*))?$'
          validate_tag() {
            local tag="$1"
            if [[ ! "$tag" =~ $tag_pattern ]]; then
              return 1
            fi
            local year="${BASH_REMATCH[1]}"
            local month="${BASH_REMATCH[2]}"
            local day="${BASH_REMATCH[3]}"
            local actual expected
            actual="$(date -u -d "$year-$month-$day" +%Y-%m-%d 2>/dev/null)" || return 1
            expected="$(printf '%04d-%02d-%02d' "$((10#$year))" "$((10#$month))" "$((10#$day))")"
            [[ "$actual" == "$expected" ]]
          }
          for tag in v2026.9.12 v2026.9.12-1 v2024.2.29; do
            if ! validate_tag "$tag"; then
              echo "accepted release tag rejected: $tag"
              exit 1
            fi
          done
          for tag in v1abc v0000.1.1 v2026 v2026.9 v2026.13.1 v2026.9.0 v2026.9.32 v2026.2.29 v2026.4.31 v2026.9.12-0; do
            if validate_tag "$tag"; then
              echo "invalid release tag accepted: $tag"
              exit 1
            fi
          done
          if ! validate_tag "$GITHUB_REF_NAME"; then
            echo "release tag must match a valid vYYYY.M.D[-N]: $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          if [[ "$GITHUB_REF_NAME" =~ -[1-9][0-9]*$ ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Run Tests (Go-only)
        env:
          GOMAXPROCS: "2"
          TOKEN_ANALYZER_DB: ""
        run: |
          go test -p 1 ./...

      - name: Build Multi-Platform Binaries
        run: |
          make release VERSION="${{ steps.verify-tag.outputs.version }}"

      - name: Smoke Check Binary
        run: |
          test "$(./dist/token-analyzer-linux-amd64 --version)" = "token-analyzer ${{ steps.verify-tag.outputs.version }}"
          ./dist/token-analyzer-linux-amd64 --help

      - name: Package Archives and Checksums
        run: |
          cd dist
          tar -czf token-analyzer-linux-amd64.tar.gz token-analyzer-linux-amd64
          tar -czf token-analyzer-linux-arm64.tar.gz token-analyzer-linux-arm64
          tar -czf token-analyzer-darwin-amd64.tar.gz token-analyzer-darwin-amd64
          tar -czf token-analyzer-darwin-arm64.tar.gz token-analyzer-darwin-arm64
          python3 -m zipfile -c token-analyzer-windows-amd64.zip token-analyzer-windows-amd64.exe
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/token-analyzer-linux-amd64.tar.gz
            dist/token-analyzer-linux-arm64.tar.gz
            dist/token-analyzer-darwin-amd64.tar.gz
            dist/token-analyzer-darwin-arm64.tar.gz
            dist/token-analyzer-windows-amd64.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.verify-tag.outputs.prerelease }}
