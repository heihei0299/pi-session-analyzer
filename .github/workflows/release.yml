name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify Release Tag
        run: |
          tag_pattern='^v[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(-[0-9]+)?$'
          for tag in v2026.9.12 v2026.9.12-1; do
            if [[ ! "$tag" =~ $tag_pattern ]]; then
              echo "accepted release tag rejected: $tag"
              exit 1
            fi
          done
          for tag in v1abc v2026 v2026.9 v2026.13.1 v2026.9.0 v2026.9.32; do
            if [[ "$tag" =~ $tag_pattern ]]; then
              echo "invalid release tag accepted: $tag"
              exit 1
            fi
          done
          if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            echo "release tag must match vYYYY.M.D[-N]: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Run Tests (Go-only)
        env:
          GOMAXPROCS: "2"
          TOKEN_ANALYZER_DB: ""
        run: |
          go test -p 1 ./...

      - name: Build Multi-Platform Binaries
        run: |
          make release VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke Check Binary
        run: |
          test "$(./dist/token-analyzer-linux-amd64 --version)" = "token-analyzer ${GITHUB_REF_NAME#v}"
          ./dist/token-analyzer-linux-amd64 --help

      - name: Package Archives and Checksums
        run: |
          cd dist
          tar -czf token-analyzer-linux-amd64.tar.gz token-analyzer-linux-amd64
          tar -czf token-analyzer-linux-arm64.tar.gz token-analyzer-linux-arm64
          tar -czf token-analyzer-darwin-amd64.tar.gz token-analyzer-darwin-amd64
          tar -czf token-analyzer-darwin-arm64.tar.gz token-analyzer-darwin-arm64
          python3 -m zipfile -c token-analyzer-windows-amd64.zip token-analyzer-windows-amd64.exe
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/token-analyzer-linux-amd64.tar.gz
            dist/token-analyzer-linux-arm64.tar.gz
            dist/token-analyzer-darwin-amd64.tar.gz
            dist/token-analyzer-darwin-arm64.tar.gz
            dist/token-analyzer-windows-amd64.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
