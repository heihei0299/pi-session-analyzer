name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run Tests (Go-only)
        env:
          GOMAXPROCS: "2"
          TOKEN_ANALYZER_DB: ""
        run: |
          go test -p 1 ./...

      - name: Verify Cross-Platform Compilation
        run: |
          make release

      - name: Sanity Check Binary
        run: |
          ./dist/token-analyzer-linux-amd64 --version
          ./dist/token-analyzer-linux-amd64 --help
