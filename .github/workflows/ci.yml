name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Setup Node 24 (for dual-track parity test)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Run Tests (Unit & Parity)
        run: |
          go test -v ./...

      - name: Verify Cross-Platform Compilation
        run: |
          make release

      - name: Sanity Check Binary
        run: |
          ./dist/token-analyzer-linux-amd64 --version
          ./dist/token-analyzer-linux-amd64 --help
