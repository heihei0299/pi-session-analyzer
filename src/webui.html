<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Analyzer WebUI</title>
<style>
/* zinc 暗色系（参考 pi-switch 统计页） */
:root {
  --bg: #18181b;
  --bg-panel: #27272a;
  --bg-hover: #3f3f46;
  --border: #3f3f46;
  --text: #e4e4e7;
  --text-dim: #a1a1aa;
  --accent: #818cf8;
  --danger: #f87171;
  --ok: #4ade80;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding: 16px 24px 40px;
}
header.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
header.topbar h1 { font-size: 18px; font-weight: 600; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button.tab {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
nav.tabs button.tab:hover { color: var(--text); background: var(--bg-panel); }
nav.tabs button.tab.active {
  color: var(--text);
  background: var(--bg-panel);
  border-color: var(--border);
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.toolbar .presets { display: flex; gap: 4px; }
.toolbar button {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.toolbar button:hover { color: var(--text); }
.toolbar button.active { color: var(--text); border-color: var(--accent); }
.toolbar input[type="date"] {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
}
.toolbar select {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
}
#status-line { color: var(--text-dim); font-size: 13px; margin-bottom: 8px; min-height: 20px; }
#status-line .updated { color: var(--ok); }
#error-banner {
  display: none;
  background: rgba(248, 113, 113, 0.12);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 6px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-size: 13px;
}
#error-banner.show { display: block; }
main .tab-panel { display: none; }
main .tab-panel.active { display: block; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.card .label { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
.card .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .value.unpriced { font-size: 13px; font-weight: 400; color: var(--text-dim); }
.group-controls { display: flex; gap: 4px; margin-bottom: 8px; }
.group-controls button {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.group-controls button.active { color: var(--text); border-color: var(--accent); }
.export-row { display: flex; gap: 8px; margin-bottom: 12px; }
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  font-size: 13px;
}
th, td {
  text-align: right;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
th { color: var(--text-dim); font-weight: 500; cursor: pointer; user-select: none; }
th:first-child, td:first-child { text-align: left; }
th.sortable:hover { color: var(--text); }
th .arrow { color: var(--accent); }
tbody tr:hover { background: var(--bg-hover); }
.pager { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--text-dim); font-size: 13px; }
.pager button {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 2px 10px;
  cursor: pointer;
  font-size: 13px;
}
.pager button:disabled { opacity: 0.4; cursor: default; }
.detail-table-wrap { overflow-x: auto; }
.session-group { margin-bottom: 16px; }
.session-group > h3 {
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  padding: 8px 10px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  user-select: none;
}
.session-group > h3 .count { color: var(--text-dim); font-weight: 400; }
.session-group .group-body { display: block; }
.session-group.collapsed .group-body { display: none; }
.session-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
}
.session-row .name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
  cursor: pointer;
  border-radius: 4px;
  padding: 1px 4px;
}
.session-row .name:hover { background: var(--bg-hover); color: var(--accent); }
.session-row .rename-input {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 13px;
}
.session-row .ts { color: var(--text-dim); font-size: 12px; }
.session-row .model { color: var(--text-dim); font-size: 12px; }
.session-row .err { color: var(--danger); font-size: 12px; margin-left: auto; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <h1>Token Analyzer WebUI</h1>
  <nav class="tabs">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="sessions">会话明细</button>
    <button class="tab" data-tab="requests">请求明细</button>
    <button class="tab" data-tab="manage">会话管理</button>
  </nav>
</header>

<div class="toolbar">
  <div class="presets">
    <button data-preset="today">今天</button>
    <button data-preset="7d">7天</button>
    <button data-preset="30d">30天</button>
    <button data-preset="all" class="active">全部</button>
    <button data-preset="custom">自定义</button>
  </div>
  <div id="custom-range" class="hidden">
    <input type="date" id="since-date" title="起始日期（本地时间）">
    <select id="since-hour" title="起始小时（本地时间）"><option value="">时</option><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select>
    <select id="since-minute" title="起始分钟（本地时间）"><option value="">分</option><option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select>
    <span>—</span>
    <input type="date" id="until-date" title="结束日期（本地时间）">
    <select id="until-hour" title="结束小时（本地时间）"><option value="">时</option><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select>
    <select id="until-minute" title="结束分钟（本地时间）"><option value="">分</option><option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select>
  </div>
  <span style="flex:1"></span>
  <select id="auto-refresh" title="自动刷新">
    <option value="off" selected>自动刷新: Off</option>
    <option value="5000">自动刷新: 5s</option>
    <option value="30000">自动刷新: 30s</option>
    <option value="300000">自动刷新: 5min</option>
  </select>
  <button id="refresh-btn">刷新</button>
</div>

<div id="status-line">加载中… <span id="updated-at" class="updated hidden"></span></div>
<div id="error-banner"></div>

<main>
  <section id="tab-overview" class="tab-panel active">
    <div class="cards">
      <div class="card" id="card-requests"><div class="label">请求数</div><div class="value">-</div></div>
      <div class="card" id="card-input"><div class="label">输入</div><div class="value">-</div></div>
      <div class="card" id="card-output"><div class="label">输出(含推理)</div><div class="value">-</div></div>
      <div class="card" id="card-cache"><div class="label">缓存</div><div class="value">-</div></div>
      <div class="card" id="card-reasoning"><div class="label">推理</div><div class="value">-</div></div>
      <div class="card" id="card-cache-rate"><div class="label">缓存率</div><div class="value">-</div></div>
      <div class="card" id="card-total-tokens"><div class="label">总 token</div><div class="value">-</div></div>
      <div class="card" id="card-cost"><div class="label">花费</div><div class="value">-</div></div>
    </div>
    <div class="group-controls">
      <button data-group="model" class="active">按模型</button>
      <button data-group="cwd">按 cwd</button>
    </div>
    <div class="export-row">
      <button id="export-json">导出 JSON</button>
      <button id="export-csv">导出 CSV</button>
    </div>
    <div class="detail-table-wrap">
      <table id="group-table">
        <thead><tr id="group-head"></tr></thead>
        <tbody id="group-body"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-sessions" class="tab-panel">
    <div class="detail-table-wrap">
      <table id="session-table">
        <thead><tr id="session-head">
          <th class="sortable" data-key="sessionId">会话ID <span class="arrow"></span></th>
          <th class="sortable" data-key="timestamp">时间 <span class="arrow"></span></th>
          <th class="sortable" data-key="cwd">cwd <span class="arrow"></span></th>
          <th class="sortable" data-key="model">模型 <span class="arrow"></span></th>
          <th class="sortable" data-key="requests">请求数 <span class="arrow"></span></th>
          <th class="sortable" data-key="input">输入 <span class="arrow"></span></th>
          <th class="sortable" data-key="output">输出 <span class="arrow"></span></th>
          <th class="sortable" data-key="cacheRate">缓存率 <span class="arrow"></span></th>
          <th class="sortable" data-key="totalTokens">总token <span class="arrow"></span></th>
          <th class="sortable" data-key="cost">花费 <span class="arrow"></span></th>
        </tr></thead>
        <tbody id="session-body"></tbody>
      </table>
    </div>
    <div class="pager">
      <label>每页 <select id="session-page-size"><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select> 行</label>
      <button id="session-prev" class="page-btn">上一页</button>
      <span id="session-page-info"></span>
      <button id="session-next" class="page-btn">下一页</button>
    </div>
  </section>

  <section id="tab-requests" class="tab-panel">
    <div class="detail-table-wrap">
      <table id="request-table">
        <thead><tr id="request-head" data-sort="timestamp" data-dir="desc">
          <th class="sortable" data-key="sessionId">会话ID <span class="arrow"></span></th>
          <th class="sortable" data-key="timestamp">时间 <span class="arrow"></span></th>
          <th class="sortable" data-key="model">模型 <span class="arrow"></span></th>
          <th class="sortable" data-key="input">输入 <span class="arrow"></span></th>
          <th class="sortable" data-key="output">输出 <span class="arrow"></span></th>
          <th class="sortable" data-key="cache">缓存 <span class="arrow"></span></th>
          <th class="sortable" data-key="reasoning">推理 <span class="arrow"></span></th>
          <th class="sortable" data-key="cacheRate">缓存率 <span class="arrow"></span></th>
          <th class="sortable" data-key="totalTokens">总token <span class="arrow"></span></th>
          <th class="sortable" data-key="cost">花费 <span class="arrow"></span></th>
        </tr></thead>
        <tbody id="request-body"></tbody>
      </table>
    </div>
    <div class="pager">
      <label>每页 <select id="request-page-size"><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select> 行</label>
      <button id="request-prev" class="page-btn">上一页</button>
      <span id="request-page-info"></span>
      <button id="request-next" class="page-btn">下一页</button>
    </div>
  </section>

  <section id="tab-manage" class="tab-panel">
    <div id="session-groups"></div>
  </section>
</main>

<script>
"use strict";

// ---------- 全局状态 ----------
const state = {
  since: null,
  until: null,
  groupBy: "model",
  tab: "overview",
  autoRefresh: "off",
  refreshTimer: null,
  sessions: [],
  requests: [],
};

// ---------- 工具 ----------
const $ = (sel) => document.querySelector(sel);
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtCompact(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
  return n.toLocaleString("en-US");
}
const UNPRICED = "费率未配置（免费/未定价）";
function fmtCost(n) { return n === 0 ? UNPRICED : n.toLocaleString("en-US", { maximumFractionDigits: 6 }); }
function fmtRate(r) { return (r * 100).toFixed(2) + "%"; }
function dateStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
// UTC ISO 时间戳 → 本地显示（YYYY-MM-DD HH:MM:SS）；pi 会话时间戳为 UTC，筛选按本地，显示统一本地基准
function fmtTimestamp(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
// 预设按钮日期参数：全部时间筛选按本地时间适配（后端 parseTimestamp 按本地解释日期）
function dateStamp() { const d = new Date(); return dateStr(d) + "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + String(d.getSeconds()).padStart(2, "0"); }

function filterParams() {
  const p = new URLSearchParams();
  if (state.since) p.set("since", state.since);
  if (state.until) p.set("until", state.until);
  return p;
}
async function api(path, params = filterParams()) {
  const res = await fetch("/api/" + path + (params && params.toString() ? "?" + params : ""));
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).detail ?? ""; } catch { /* 非 JSON 错误体 */ }
    throw new Error(detail || `HTTP ${res.status}`);
  }
  return res.json();
}

// ---------- 错误横幅 ----------
function showError(msg) { const el = $("#error-banner"); el.textContent = msg; el.classList.add("show"); }
function clearError() { $("#error-banner").classList.remove("show"); }

// ---------- 状态行 ----------
function renderStatus(meta) {
  $("#status-line").innerHTML = `数据目录: <code>${escapeHtml(meta.dir)}</code> · 会话数: ${meta.sessionCount} · 范围: ${fmtTimestamp(meta.dataRange.since) || "-"} ~ ${fmtTimestamp(meta.dataRange.until) || "-"}`;
}

// ---------- 总览卡片 ----------
function renderCards(totals) {
  setCard("card-requests", fmtCompact(totals.requests));
  setCard("card-input", fmtCompact(totals.input));
  setCard("card-output", fmtCompact(totals.output + totals.reasoning));
  setCard("card-cache", fmtCompact(totals.cacheRead + totals.cacheWrite));
  setCard("card-reasoning", fmtCompact(totals.reasoning));
  setCard("card-cache-rate", fmtRate(totals.cacheRate));
  setCard("card-total-tokens", fmtCompact(totals.totalTokens));
  setCardCost("card-cost", totals.cost);
}
function setCard(id, text) { const el = $("#" + id).querySelector(".value"); el.textContent = text; el.classList.remove("unpriced"); }
function setCardCost(id, cost) {
  const el = $("#" + id).querySelector(".value");
  if (cost === 0) { el.textContent = UNPRICED; el.classList.add("unpriced"); }
  else { el.textContent = fmtCost(cost); el.classList.remove("unpriced"); }
}

// ---------- 分组表 ----------
const GROUP_COLS = [
  { key: "key", label: "分组键" },
  { key: "requests", label: "请求数" },
  { key: "input", label: "输入" },
  { key: "output", label: "输出" },
  { key: "cacheRate", label: "缓存率" },
  { key: "totalTokens", label: "总token" },
  { key: "cost", label: "花费" },
];
const GROUP_FMTS = {
  cacheRate: fmtRate,
  input: fmtCompact,
  output: fmtCompact,
  totalTokens: fmtCompact,
  cost: (v) => (v === 0 ? UNPRICED : fmtCost(v)),
};
async function refreshGroups() {
  const params = filterParams();
  params.set("by", state.groupBy);
  const data = await api("groups", params);
  const rows = data.rows.map((r) => ({ key: state.groupBy === "model" ? (r.model ?? "-") : (r.cwd ?? "-"), ...r }));
  renderTable($("#group-head"), $("#group-body"), GROUP_COLS, rows, GROUP_FMTS);
}

// ---------- 通用表格渲染 ----------
function renderTable(headEl, bodyEl, cols, rows, fmts = {}) {
  headEl.innerHTML = cols.map((c) => `<th data-key="${c.key}">${c.label}</th>`).join("");
  bodyEl.innerHTML = rows
    .map((r) => "<tr>" + cols.map((c) => { const v = r[c.key]; const f = fmts[c.key]; return `<td>${f ? f(v) : v}</td>`; }).join("") + "</tr>")
    .join("");
}

// ---------- 总览刷新 ----------
async function refreshOverview() {
  try {
    clearError();
    const [totals, meta] = await Promise.all([api("totals"), api("meta", new URLSearchParams())]);
    renderCards(totals);
    renderStatus(meta);
    await refreshGroups();
  } catch (e) {
    showError("加载失败: " + e.message);
  }
}

// ---------- 时间预设 ----------
function applyPreset(preset) {
  document.querySelectorAll("[data-preset]").forEach((b) => b.classList.toggle("active", b.dataset.preset === preset));
  const now = new Date();
  if (preset === "all") {
    state.since = null;
    state.until = null;
    $("#custom-range").classList.add("hidden");
  } else if (preset === "custom") {
    $("#custom-range").classList.remove("hidden");
    applyCustomRange();
  } else {
    $("#custom-range").classList.add("hidden");
    const days = preset === "today" ? 0 : preset === "7d" ? 6 : 29;
    // 本地自然日：本地日期字段推算（setDate 自动处理跨月/跨年）；后端 parseTimestamp 按本地解释
    const since = new Date(now);
    since.setDate(now.getDate() - days);
    state.since = dateStr(since);
    state.until = dateStr(now);
  }
  refreshAll();
}

// ---------- 自定义时间范围（date + 时分下拉，输入即生效，本地时间语义） ----------
/** 由 6 个输入控件拼接 since/until：只有日期 → 纯日期（本地全天）；日期+时分 → YYYY-MM-DDTHH:MM（本地时间，后端按本地解释） */
function customRangeValue() {
  const sd = $("#since-date").value, sh = $("#since-hour").value, sm = $("#since-minute").value;
  const ud = $("#until-date").value, uh = $("#until-hour").value, um = $("#until-minute").value;
  const timeOf = (h, m) => (h !== "" && m !== "" ? `${h}:${m}` : "");
  return {
    since: sd ? (timeOf(sh, sm) ? `${sd}T${timeOf(sh, sm)}` : sd) : null,
    until: ud ? (timeOf(uh, um) ? `${ud}T${timeOf(uh, um)}` : ud) : null,
  };
}
function applyCustomRange() {
  const v = customRangeValue();
  state.since = v.since;
  state.until = v.until;
  refreshAll();
}
function bindCustomRange() {
  for (const id of ["since-date", "since-hour", "since-minute", "until-date", "until-hour", "until-minute"]) {
    // date 用 input（实时），select 用 change（select 无 input 事件语义）
    $("#" + id).addEventListener(id.endsWith("-date") ? "input" : "change", applyCustomRange);
  }
}

// ---------- 导出 ----------
async function exportData(format) {
  try {
    clearError();
    const params = filterParams();
    const [totals, sessions, requests] = await Promise.all([api("totals", params), api("sessions", params), api("requests", params)]);
    const stamp = dateStamp();
    if (format === "json") {
      const blob = new Blob([JSON.stringify({ totals, sessions, requests }, null, 2)], { type: "application/json" });
      downloadBlob(blob, `token-analyzer-${stamp}.json`);
    } else {
      const blob = new Blob([toCsv3(totals, sessions, requests)], { type: "text/csv" });
      downloadBlob(blob, `token-analyzer-${stamp}.csv`);
    }
  } catch (e) {
    showError("导出失败: " + e.message);
  }
}
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function csvSection(title, rows) {
  if (!rows || rows.length === 0) return `# ${title}\n`;
  const keys = Object.keys(rows[0]);
  const esc = (v) => /[",\n\r]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const lines = ["# " + title, keys.map(esc).join(","), ...rows.map((r) => keys.map((k) => esc(r[k])).join(","))];
  return lines.join("\n");
}
function toCsv3(totals, sessions, requests) {
  const parts = [csvSection("totals", [totals]), "", csvSection("sessions", sessions.rows), "", csvSection("requests", requests.rows)];
  return parts.join("\n");
}

// ---------- 明细视图（会话/请求）：列定义 + 排序 + 分页 ----------
const SESSION_COLS = ["sessionId", "timestamp", "cwd", "model", "requests", "input", "output", "cacheRate", "totalTokens", "cost"];
const REQUEST_COLS = ["sessionId", "timestamp", "model", "input", "output", "cache", "reasoning", "cacheRate", "totalTokens", "cost"];
const METRIC_FMTS = {
  timestamp: fmtTimestamp,
  requests: fmtCompact,
  input: fmtCompact,
  output: fmtCompact,
  cache: fmtCompact,
  reasoning: fmtCompact,
  totalTokens: fmtCompact,
  cacheRate: fmtRate,
  cost: (v) => (v === 0 ? UNPRICED : fmtCost(v)),
};
const detailState = {
  sessions: { sortKey: null, sortDir: "asc", page: 1, size: 20, rows: [] },
  requests: { sortKey: "timestamp", sortDir: "desc", page: 1, size: 20, rows: [] },
};

// kind（API 端点复数）→ HTML id 前缀（单数）：session-*/request-*
const DETAIL_ID = { sessions: "session", requests: "request" };

async function fetchRows(kind) {
  const data = await api(kind);
  const st = detailState[kind];
  st.rows = data.rows;
  st.page = 1;
  return st;
}
function sortRows(st) {
  if (!st.sortKey) return st.rows;
  const k = st.sortKey;
  const dir = st.sortDir === "asc" ? 1 : -1;
  // 请求明细「缓存」列 = cacheRead + cacheWrite（API 行无 cache 字段）
  const valueOf = (r) => (k === "cache" ? (r.cacheRead ?? 0) + (r.cacheWrite ?? 0) : r[k]);
  return [...st.rows].sort((a, b) => {
    const va = valueOf(a);
    const vb = valueOf(b);
    if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
    return String(va).localeCompare(String(vb)) * dir;
  });
}
function renderDetailTable(kind) {
  const st = detailState[kind];
  const headEl = $("#" + DETAIL_ID[kind] + "-head");
  const bodyEl = $("#" + DETAIL_ID[kind] + "-body");
  const sorted = sortRows(st);
  const start = (st.page - 1) * st.size;
  const pageRows = sorted.slice(start, start + st.size);
  const cols = kind === "sessions" ? SESSION_COLS : REQUEST_COLS;
  // 请求明细「缓存」列 = cacheRead + cacheWrite（API 行字段为拆分的 cacheRead/cacheWrite）
  const valueOf = (r, c) => (c === "cache" ? (r.cacheRead ?? 0) + (r.cacheWrite ?? 0) : r[c]);
  bodyEl.innerHTML = pageRows
    .map((r) => "<tr>" + cols.map((c) => `<td>${(METRIC_FMTS[c] ? METRIC_FMTS[c](valueOf(r, c)) : valueOf(r, c)) ?? ""}</td>`).join("") + "</tr>")
    .join("");
  headEl.querySelectorAll("th").forEach((th) => {
    const arrow = th.querySelector(".arrow");
    if (arrow) arrow.textContent = th.dataset.key === st.sortKey ? (st.sortDir === "asc" ? "▲" : "▼") : "";
  });
  const infoEl = $("#" + DETAIL_ID[kind] + "-page-info");
  const total = sorted.length;
  const pages = Math.max(1, Math.ceil(total / st.size));
  infoEl.textContent = `${total} 行 · 第 ${st.page}/${pages} 页`;
  // 翻页键状态：首页禁上一页、末页禁下一页
  $("#" + DETAIL_ID[kind] + "-prev").disabled = st.page <= 1;
  $("#" + DETAIL_ID[kind] + "-next").disabled = st.page >= pages;
}
async function refreshSessionTable() {
  try {
    clearError();
    await fetchRows("sessions");
    renderDetailTable("sessions");
  } catch (e) { showError("会话明细加载失败: " + e.message); }
}
async function refreshRequestTable() {
  try {
    clearError();
    await fetchRows("requests");
    renderDetailTable("requests");
  } catch (e) { showError("请求明细加载失败: " + e.message); }
}
function bindDetailInteractions() {
  for (const kind of ["sessions", "requests"]) {
    $("#" + DETAIL_ID[kind] + "-head").addEventListener("click", (e) => {
      const th = e.target.closest("th");
      if (!th) return;
      const key = th.dataset.key;
      const st = detailState[kind];
      if (st.sortKey === key) st.sortDir = st.sortDir === "asc" ? "desc" : "asc";
      else { st.sortKey = key; st.sortDir = "asc"; }
      st.page = 1;
      renderDetailTable(kind);
    });
    $("#" + DETAIL_ID[kind] + "-page-size").addEventListener("change", (e) => {
      detailState[kind].size = Number(e.target.value);
      detailState[kind].page = 1;
      renderDetailTable(kind);
    });
    $("#" + DETAIL_ID[kind] + "-prev").addEventListener("click", () => {
      const st = detailState[kind];
      if (st.page > 1) { st.page--; renderDetailTable(kind); }
    });
    $("#" + DETAIL_ID[kind] + "-next").addEventListener("click", () => {
      const st = detailState[kind];
      const pages = Math.max(1, Math.ceil(st.rows.length / st.size));
      if (st.page < pages) { st.page++; renderDetailTable(kind); }
    });
  }
}

// ---------- 自动刷新（全量重算轮询；静默替换；变化时状态行显示「已更新 HH:MM:SS」） ----------
function pad2(n) { return String(n).padStart(2, "0"); }
let lastSnapshot = "";
function setAutoRefresh(ms) {
  if (state.refreshTimer) { clearInterval(state.refreshTimer); state.refreshTimer = null; }
  if (ms > 0) state.refreshTimer = setInterval(poll, ms);
}
async function snapshot() {
  const params = filterParams();
  if (state.tab === "overview") {
    const t = await api("totals", params);
    const gp = filterParams();
    gp.set("by", state.groupBy);
    const g = await api("groups", gp);
    return JSON.stringify([t, g]);
  }
  if (state.tab === "sessions") return JSON.stringify((await api("sessions", params)).rows);
  if (state.tab === "requests") return JSON.stringify((await api("requests", params)).rows);
  // 会话管理 tab：忽略筛选，展示全部会话
  return JSON.stringify((await api("sessions", new URLSearchParams())).rows);
}
async function poll() {
  try {
    const snap = await snapshot();
    if (snap !== lastSnapshot) {
      lastSnapshot = snap;
      await refreshAll();
      const now = new Date();
      $("#updated-at").textContent = "已更新 " + pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
      $("#updated-at").classList.remove("hidden");
    }
  } catch {
    // 轮询失败静默（错误横幅由 refreshAll 内部处理）
  }
}

// ---------- tab 切换：切换即拉取对应端点（无整页刷新） ----------
function switchTab(tab) {
  state.tab = tab;
  lastSnapshot = ""; // 切换后下一次轮询重新对比
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-" + tab));
  refreshAll();
}

// ---------- 会话管理：按 cwd 分组展示全部会话（忽略筛选）+ 行内重命名 ----------
function sessionRowHtml(r) {
  const errId = "err-" + r.sessionId;
  return `<div class="session-row" data-sid="${escapeHtml(r.sessionId)}">
    <span class="name" title="点击重命名：${escapeHtml(r.displayName)}">${escapeHtml(r.displayName)}</span>
    <span class="ts">${escapeHtml(fmtTimestamp(r.timestamp))}</span>
    <span class="model">${escapeHtml(r.model)}</span>
    <span class="req">${r.requests}</span>
    <span class="tok">${fmtCompact(r.totalTokens)}</span>
    <span class="err" id="${errId}"></span>
  </div>`;
}
async function refreshSessionGroups() {
  try {
    clearError();
    const data = await api("sessions", new URLSearchParams()); // 展示全部会话
    const groups = new Map();
    for (const r of data.rows) {
      const key = r.cwdNorm || r.cwd || "(未知)";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const wrap = $("#session-groups");
    wrap.innerHTML = "";
    for (const [cwd, rows] of groups) {
      const g = document.createElement("div");
      g.className = "session-group";
      const h3 = document.createElement("h3");
      h3.innerHTML = `项目 ${escapeHtml(cwd)} <span class="count">(${rows.length})</span>`;
      const body = document.createElement("div");
      body.className = "group-body";
      body.innerHTML = rows.map(sessionRowHtml).join("");
      h3.addEventListener("click", () => g.classList.toggle("collapsed"));
      g.appendChild(h3);
      g.appendChild(body);
      wrap.appendChild(g);
    }
  } catch (e) {
    showError("会话管理加载失败: " + e.message);
  }
}
function bindSessionManage() {
  // 点击会话名称 → 行内编辑（同一时间只编辑一行）
  $("#session-groups").addEventListener("click", (e) => {
    const nameEl = e.target.closest(".session-row .name");
    if (!nameEl || document.querySelector(".session-row.editing")) return;
    startSessionRename(nameEl);
  });
}

/** 行内编辑：名称替换为输入框；Enter/失焦保存，Esc 取消 */
function startSessionRename(nameEl) {
  const row = nameEl.closest(".session-row");
  const errEl = row.querySelector(".err");
  errEl.textContent = "";
  row.classList.add("editing");
  const prevText = nameEl.textContent;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "rename-input";
  input.value = prevText;
  input.maxLength = 100;
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  let saveOnBlur = false;
  let done = false;
  const exitEdit = (save) => {
    if (done) return;
    done = true;
    const name = input.value.trim();
    if (!save || !name) {
      if (name === "") errEl.textContent = "显示名不能为空";
      restoreSessionName(input, row, prevText);
      return;
    }
    saveSessionRename(row, input, errEl, name);
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); saveOnBlur = true; input.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); saveOnBlur = false; input.blur(); }
  });
  input.addEventListener("blur", () => exitEdit(saveOnBlur));
}

/** 恢复名称 span（取消编辑或保存失败后） */
function restoreSessionName(input, row, text) {
  const span = document.createElement("span");
  span.className = "name";
  span.title = "点击重命名：" + text;
  span.textContent = text;
  input.replaceWith(span);
  row.classList.remove("editing");
}

/** 保存重命名：POST /api/sessions/rename，成功刷新分组 */
async function saveSessionRename(row, input, errEl, name) {
  const sid = row.dataset.sid;
  try {
    const res = await fetch("/api/sessions/rename", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId: sid, name }),
    });
    const body = await res.json();
    if (!res.ok) {
      errEl.textContent = body.detail || ("HTTP " + res.status);
      restoreSessionName(input, row, name);
      return;
    }
    await refreshSessionGroups();
  } catch {
    errEl.textContent = "重命名失败";
    restoreSessionName(input, row, name);
  }
}

// ---------- 统一刷新入口 ----------
function refreshAll() {
  if (state.tab === "overview") refreshOverview();
  if (state.tab === "sessions") refreshSessionTable();
  if (state.tab === "requests") refreshRequestTable();
  if (state.tab === "manage") refreshSessionGroups();
}

// ---------- 初始化 ----------
function init() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  document.querySelectorAll("[data-group]").forEach((b) => b.addEventListener("click", () => {
    state.groupBy = b.dataset.group;
    document.querySelectorAll("[data-group]").forEach((x) => x.classList.toggle("active", x === b));
    refreshOverview();
  }));
  document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => applyPreset(b.dataset.preset)));
  bindCustomRange();
  $("#export-json").addEventListener("click", () => exportData("json"));
  $("#export-csv").addEventListener("click", () => exportData("csv"));
  $("#refresh-btn").addEventListener("click", () => refreshAll());
  $("#auto-refresh").addEventListener("change", (e) => {
    const v = e.target.value;
    setAutoRefresh(v === "off" ? 0 : Number(v));
  });
  bindDetailInteractions();
  bindSessionManage();
  refreshAll();
}
init();
</script>
